<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e3eff6">
<title>開瑄國小課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: KAISHIUAN CAMPUS — calm Japanese architectural photography meets a modern school brand; editorial, warm, unfussy
   IDEA: the timetable is a long white school building under a pale sky: horizontal bands, pale-blue columns, generous air
   PICTURE: the real 開瑄 building illustration as a sky-to-wall banner, then the timetable sheet itself
   COLOUR and TYPE: sky blue + wall white + column blue, one warm sand accent; Cormorant Garamond wordmark, Noto Sans TC
   LAYOUT: deep-blue sidebar with wordmark and nav; banner header; class row; one white sheet with the grid; day list on phones */
:root{color-scheme:light;
--bg:light-dark(#fbfaf6,#121c24);--sheet:light-dark(#ffffff,#1a2731);--ink:light-dark(#142836,#f1f5f8);--soft:light-dark(#4f5e68,#b8c7d0);
--line:light-dark(#ebe8e0,#2a3a46);--sky:light-dark(#e2eff8,#1d3445);--col:light-dark(#9fcbe6,#5f8fb0);
--navy:light-dark(#3a7bab,#8fc0e0);--side1:light-dark(#3d6e93,#0f2232);--side2:light-dark(#6f9dbd,#1a3447);
--sand:#eaa75e;--sand-ink:#fff;--head:light-dark(#d8e8f3,#2a4558);--headink:light-dark(#24517a,#dbe8f1);
--pill:light-dark(#f5f3ee,#22323e);
--c-lang:light-dark(#fbeadb,#3d2c22);--i-lang:#d98a4e;--c-eng:light-dark(#f6e6f1,#38283a);--i-eng:#b46aa6;
--c-math:light-dark(#fbf1d2,#3a3320);--i-math:#c49a2c;--c-sci:light-dark(#e6f0df,#24362a);--i-sci:#6f9a5a;
--c-art:light-dark(#f6e4e6,#3a2a2e);--i-art:#c06b7b;--c-pe:light-dark(#e1ecf5,#1f3344);--i-pe:#4f86b4;
--c-it:light-dark(#e6e8f5,#272d42);--i-it:#5b6fa8;--c-etc:light-dark(#efeeea,#29323a);--i-etc:#8a8f93}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Huninn","Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.app{min-height:100vh}
.hd .in,main>*{max-width:1240px;margin-inline:auto}
/* sidebar */
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--side1),var(--side2));color:#fff;display:flex;flex-direction:column;padding:30px 0 0;overflow:hidden}
.mark{text-align:center;padding:0 16px 34px}
.mark svg{width:96px;height:40px;display:block;margin:0 auto 8px}
.mark b{display:block;font:600 21px/1 "Cormorant Garamond",serif;letter-spacing:.22em;margin-inline-start:.22em}
.mark small{display:block;font-size:11px;letter-spacing:.3em;opacity:.8;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:6px;padding-inline-end:14px}
.nav button{display:flex;align-items:center;gap:14px;border:0;background:none;color:#fff;font-size:17px;font-weight:700;min-height:52px;padding:0 22px;border-radius:0 16px 16px 0;cursor:pointer;text-align:start}
.nav button svg{width:24px;height:24px;flex:none}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button[aria-pressed=true]{background:var(--sand);box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.side .hill{margin-top:auto;height:120px;background:radial-gradient(120% 90% at 30% 100%,rgba(255,255,255,.22) 0 45%,transparent 46%),radial-gradient(90% 70% at 90% 110%,rgba(255,255,255,.14) 0 50%,transparent 51%)}
/* header */
.hd{position:relative;padding:28px max(3vw,18px) 0;min-height:210px;overflow:hidden;background:linear-gradient(180deg,var(--sky),transparent 92%)}

.hd .in{position:relative}
h1{font-size:clamp(28px,3.4vw,42px);line-height:1.1;margin:0;font-weight:900;letter-spacing:.04em;text-wrap:balance}
.en{margin:8px 0 0;font-size:14px;letter-spacing:.32em;color:var(--soft);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:26px}
.seg{display:flex;gap:6px;background:var(--sheet);padding:5px;border-radius:16px;box-shadow:0 6px 18px -12px rgba(31,51,66,.4)}
.seg button{border:0;background:none;font-weight:700;font-size:16px;min-height:44px;padding:0 20px;border-radius:12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sand);color:var(--sand-ink)}
.sbox{position:relative;flex:0 1 300px}
.sbox svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--soft)}
.search{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 16px 0 42px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
main{padding:14px max(3vw,18px) 40px}
.chips{display:flex;flex-wrap:wrap;gap:8px;column-gap:10px}
.gset{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grp{font-size:13px;color:var(--soft);margin-inline-end:2px}
.chip{border:1px solid var(--line);background:var(--sheet);font-size:16px;font-weight:700;min-height:44px;padding:0 18px;border-radius:14px;cursor:pointer;box-shadow:0 4px 12px -10px rgba(31,51,66,.5)}
.chip:hover{border-color:var(--col)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:light-dark(#fff,#0f2232)}
.chip.mini{min-height:40px;font-size:15px;padding:0 14px}.chips .brk{flex-basis:100%;height:0}
/* sheet */
.card{margin-top:16px;background:var(--sheet);border-radius:26px;padding:clamp(16px,2.2vw,30px);box-shadow:0 1px 0 var(--line),0 24px 50px -36px rgba(31,51,66,.45)}
.head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h2{display:flex;align-items:center;gap:14px;font-size:clamp(24px,2.6vw,32px);line-height:1.1;margin:0;font-weight:900;letter-spacing:.04em}
.head h2::before{content:"";flex:none;width:34px;height:26px;background:repeating-linear-gradient(90deg,var(--col) 0 4px,transparent 4px 10px)}

function lists(){

  const order=Object.keys(PEOPLE);
  tch.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});

function cellHTML(l){
  const k='k-'+cat(l.s);let t='',r='';
  if(st.mode==='class'){t=l.s==='晨光閱讀'?'':l.t.map(pName).join('、');r=l.r?`<span class="r sp">${esc(l.r)}</span>`:''}

function todayIdx(){const g=new Date().getDay();return g>=1&&g<=5?g-1:-1}
const tm=s=>{const[a,b]=s.split(':');return a*60+ +b};
function curPer(){const n=new Date(),m=n.getHours()*60+n.getMinutes();return PER.findIndex(p=>m>=tm(p[1])&&m<tm(p[2]))}
function isNow(d,p){return d===todayIdx()&&p===curPer()}
function nowSlot(){
  const n=new Date(),g=n.getDay(),m=n.getHours()*60+n.getMinutes();
  if(g>=1&&g<=5){for(let i=0;i<PER.length;i++){if(m<tm(PER[i][2]))return{d:g-1,p:i,st:m>=tm(PER[i][1])?'now':'next'}}}
  return{d:(g>=1&&g<=4)?g:0,p:0,st:'off'};
}
function slot(items,d,p){
  const its=items.filter(l=>l.d===d&&l.p===p);
  const nowc=isNow(d,p)?' nowcell':'';
  const today=d===todayIdx()?' col-today':'';
  if(!its.length){
    const lbl=st.mode!=='class'?(p>0?'空堂':''):((p>=5)&&!items.some(l=>l.d===d&&l.p>=5)?'無課':'');
    return `<div class="cell empty${nowc}${today}"><span>${lbl}</span></div>`;
  }
  const html=its.map(cellHTML).join('');
  const x=(d===2&&p===0)?'<span class="x">週三晨光為升旗時間</span>':'';
  return its.length>1?`<div class="multi${nowc}">${html}</div>`:html.replace('class="cell ',`class="cell${nowc}${today} `).replace('</div>',x+'</div>');
}

/* ---------- marquee / notice ---------- */
let NOTICE_RAW='',mqLast='';
function parseNotice(txt){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')).filter(s=>{
    const m=s.match(/^(?:(\d{4})[\/.-])?(\d{1,2})[\/.-](\d{1,2})(?![\d])/);if(!m)return true;
    let y=m[1]?+m[1]:now.getFullYear();const dt=new Date(y,+m[2]-1,+m[3]);
    if(!m[1]&&today-dt>200*864e5)dt.setFullYear(y+1);
    return dt>=today;
  });
}
function mqAuto(){
  const n=new Date(),g=n.getDay(),a=nowSlot(),out=[`${n.getMonth()+1}月${n.getDate()}日 星期${'日一二三四五六'[g]}`];
  if(a.st==='now'){const c=new Set(L.filter(l=>l.d===a.d&&l.p===a.p).flatMap(l=>l.t)).size;out.push(`現在是${PER[a.p][0]}（${PER[a.p][1]}–${PER[a.p][2]}），${c} 位老師上課中`)}
  else if(a.st==='next')out.push(`下一節：${PER[a.p][0]} ${PER[a.p][1]} 開始`);
  else out.push(g>=1&&g<=5?'今天的課程已經結束，辛苦了':'今天是假日，好好休息');
  if(g===3&&a.st!=='off'&&a.p===0)out.push('週三晨光為升旗時間');
  return out;
}
function mqRender(){
  const items=[...mqAuto(),...parseNotice(NOTICE_RAW)];const key=items.join('|');if(key===mqLast)return;mqLast=key;
  const one=`<span>${items.map(s=>`<i>${esc(s)}</i>`).join('')}</span>`;
  const tr=$('mqTrack');tr.innerHTML=one+one.replace('<span>','<span aria-hidden="true">');
  tr.style.setProperty('--dur',Math.max(18,key.length*0.32)+'s');
}

let CONFIG=null,CONFIG_STATE='unknown';
async function getText(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw r.status;return r.text()}

/* ---------- crypto + GitHub ---------- */
const te=new TextEncoder(),td8=new TextDecoder();
const toB64=u=>{let x='';for(let i=0;i<u.length;i+=0x8000)x+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(x)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encToken(tok,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pw,salt),te.encode(tok)));return{v:1,owner:GH.owner,repo:GH.repo,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)}}
async function decToken(cfg,pw){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(cfg.iv)},await keyFrom(pw,fromB64(cfg.salt)),fromB64(cfg.ct));return td8.decode(pt)}
const API=p=>`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${p}`;
const hdr=tok=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghPut(tok,path,text,msg){
  const g=await fetch(API(path)+'?ref='+GH.branch+'&t='+Date.now(),{headers:hdr(tok),cache:'no-store'});
  if(g.status===401)throw new Error('權杖無效或已過期');
  const sha=g.ok?(await g.json()).sha:undefined;
  const r=await fetch(API(path),{method:'PUT',headers:{...hdr(tok),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:toB64(te.encode(text)),branch:GH.branch,...(sha?{sha}:{})})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status===403||r.status===404?'權杖沒有這個 repo 的寫入權限':`GitHub 回應 ${r.status}${j.message?'：'+j.message:''}`)}
}

  try{const cfg=await encToken(tok,a);await ghPut(tok,'config.json',JSON.stringify(cfg,null,1)+'\n','設定管理密碼');CONFIG=cfg;CONFIG_STATE='ok';TOKEN=tok;$('tk').value=$('np1').value=$('np2').value='';msg('設定完成！之後用這組密碼就能發布公告和課表。');tab('nt')}
  catch(e){msg('儲存失敗：'+e.message)}
};

/* ---------- Excel import ---------- */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('讀取 Excel 元件失敗，請檢查網路'));document.head.appendChild(s)})}
function cnYear(s){const m=String(s).match(/([〇零一二三四五六七八九\d]{2,4})\s*學年度/);if(!m)return'';return m[1].replace(/[〇零一二三四五六七八九]/g,c=>'〇一二三四五六七八九'.indexOf(c)>=0?'〇一二三四五六七八九'.indexOf(c):0).replace(/零/g,'0')}
function parseWorkbook(wb){
  const X=XLSX.utils,warn=[];
  const hidden=new Set(((wb.Workbook||{}).Sheets||[]).filter(s=>s.Hidden).map(s=>s.name));
  const reader=ws=>{const mg=ws['!merges']||[];return(r,c)=>{for(const m of mg)if(r>=m.s.r&&r<=m.e.r&&c>=m.s.c&&c<=m.e.c){r=m.s.r;c=m.s.c;break}
    const cell=ws[X.encode_cell({r,c})];if(!cell||cell.t==='e')return'';const v=String(cell.w??cell.v??'').trim();return v==='0'||v.startsWith('#')?'':v}};
  const rows=ws=>{const rg=X.decode_range(ws['!ref']||'A1');return rg.e.r};
  // 1. class sheet
  let best=null;
  for(const name of wb.SheetNames){if(hidden.has(name))continue;const ws=wb.Sheets[name],get=reader(ws),n=rows(ws);let cnt=0;
    for(let r=0;r<=n;r++)if(/^\d{3}$/.test(get(r,0))&&get(r,1)==='一')cnt++;
    if(cnt&&(!best||cnt>best.cnt||(cnt===best.cnt&&name.startsWith('班表'))))best={name,cnt}}
  if(!best)throw new Error('找不到班級課表分頁（A 欄要有 101 這類班級代號、B 欄是星期一到五）');
  const ws=wb.Sheets[best.name],get=reader(ws),n=rows(ws);
  const year=cnYear(get(0,0))||DATA.year||'';
  const lessons=[];
  for(let r=0;r<=n;r++){const c=get(r,0);if(!/^\d{3}$/.test(c)||get(r,1)!=='一')continue;
    for(let d=0;d<5;d++){if(get(r+d,1)!==DAYS[d])warn.push(`${c} 班第 ${d+1} 列不是星期${DAYS[d]}，請檢查`);
      for(let p=0;p<9;p++){const s=get(r+d,2+2*p);if(!s)continue;const t=get(r+d,3+2*p).split(/[\s　]+/).filter(Boolean);
        if(p>=PER.length){warn.push(`${c} 班星期${DAYS[d]}第八節「${s}」：網頁目前只顯示到第七節，已略過`);continue}
        lessons.push({c,d,p,s,t,r:''})}}}
  const classes=[...new Set(lessons.map(l=>l.c))];
  // 2. room sheets
  const PL={'晨光時間':0,'晨光':0,'第一節':1,'第二節':2,'第三節':3,'第四節':4,'第五節':5,'第六節':6,'第七節':7,'第八節':8};
  const roomsFound=[],seen=new Set();
  for(const name of wb.SheetNames){const room=name.trim();if(hidden.has(name)||!/教室$/.test(room))continue;roomsFound.push(room);
    const w=wb.Sheets[name],g=reader(w),m=rows(w);let dc=[1,2,3,4,5];
    for(let r=0;r<=Math.min(m,10);r++)for(let c=0;c<10;c++){const i=DAYS.findIndex(x=>g(r,c)==='星期'+x);if(i>=0)dc[i]=c}
    for(let r=0;r<=m;r++){const p=PL[g(r,0)];if(p==null||p>=PER.length)continue;
      for(let d=0;d<5;d++){const s=g(r,dc[d]),k=g(r+1,dc[d]);if(!s||s==='升旗時間')continue;
        if(/^\d{3}$/.test(k)){const l=lessons.find(x=>x.c===k&&x.d===d&&x.p===p);
          const AL={'生活-美':'美勞','生活-音':'音樂'};if(l&&(l.s===s||AL[l.s]===s))l.r=room;else warn.push(`${room}：星期${DAYS[d]}${PER[p][0]}寫 ${k}「${s}」，但總課表是「${l?l.s:'沒有課'}」，以總課表為準`)}
        else{const key=s+'|'+d+'|'+p+'|'+room;if(!seen.has(key)){seen.add(key);lessons.push({c:'',d,p,s,t:EXTRA_T[s]||[],r:room})}}}}}
  for(const l of lessons)if(!l.r&&l.c&&(l.s==='音樂'||l.s==='生活-音'))l.r='音樂教室';
  // 3. names
  const people={...PEOPLE};
  for(const name of wb.SheetNames){if(!name.includes('教師課表'))continue;const w=wb.Sheets[name],g=reader(w),m=rows(w);
    for(let r=0;r<=m;r++){const v=g(r,0).replace(/\s/g,'');const mm=v.match(/^(.+?)(主任|組長|教師|老師)$/);if(!mm)continue;const nm=mm[1];
      people[nm.length>=3?nm.slice(-2):nm]={name:nm,title:mm[2]==='教師'?'老師':mm[2]}}}
  const home={};for(const c of classes){const l=lessons.find(x=>x.c===c&&x.d===0&&x.p===0)||lessons.find(x=>x.c===c&&x.p===0);if(l&&l.t[0])home[c]=l.t[0]}
  const tch=[...new Set(lessons.flatMap(l=>l.t))];
  const noName=tch.filter(t=>!people[t]);
  return{data:{year,updated:new Date().toISOString(),lessons,home,people},info:{sheet:best.name,classes,lessons:lessons.length,teachers:tch.length,rooms:roomsFound,noName},warn};
}
$('xf').onchange=async e=>{
  const f=e.target.files[0];PARSED=null;$('imPub').disabled=true;if(!f)return;
  $('imOut').innerHTML='<p class="note">讀取中…</p>';
  try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});

    $('imOut').innerHTML=`<p class="ok">讀到「${esc(i.sheet)}」：${i.classes.length} 個班、${i.teachers} 位老師、${i.lessons} 節課（${esc(res.data.year)} 學年度）。</p>
      <p class="note">專科教室：${esc(i.rooms.join('、')||'沒有找到')}</p>
      ${i.noName.length?`<p class="warn">這些老師在「教師課表」找不到全名，會顯示簡稱：${esc(i.noName.join('、'))}</p>`:''}
      ${res.warn.length?`<p class="warn">有 ${res.warn.length} 個地方要注意：</p><ul>${res.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'<p class="ok">沒有發現對不上的地方。</p>'}
      <p class="note">確認無誤再按「發布到全校」。</p>`;
    $('imPub').disabled=false;
  }catch(err){$('imOut').innerHTML=`<p class="warn">讀取失敗：${esc(err.message||err)}</p>`}
};
$('imPub').onclick=async()=>{
  if(!PARSED)return;if(!TOKEN){msg('請先輸入密碼解鎖');return}
  msg('發布中…');
  try{await ghPut(TOKEN,'data.json',JSON.stringify(PARSED),`更新課表（${PARSED.year} 學年度）`);useData(PARSED);st.id='';render();mqLast='';mqRender();msg('課表已發布！全校大約 1～2 分鐘後會看到新課表。');$('imPub').disabled=true}
  catch(e){msg('發布失敗：'+e.message)}
};

/* ---------- A4 PDF export (drawn on canvas, packed into a PDF by hand) ---------- */
const PDF_C={lang:['#fbeadb','#d98a4e'],eng:['#f6e6f1','#b46aa6'],math:['#fbf1d2','#c49a2c'],sci:['#e6f0df','#6f9a5a'],art:['#f6e4e6','#c06b7b'],pe:['#e1ecf5','#4f86b4'],it:['#e6e8f5','#5b6fa8'],etc:['#efeeea','#8a8f93']};
const FONT='"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const PW=2000,PH=1414;
function viewOf(mode,id){
  const items=mode==='class'?L.filter(l=>l.c===id):mode==='teacher'?L.filter(l=>l.t.includes(id)):L.filter(l=>roomOf(l)===id);
  const teach=items.filter(l=>l.p>0);let title,meta;
  if(mode==='class'){title=id+' 班課表';meta=`導師 ${pName(HOME[id])}　每週 ${teach.length} 節（不含晨光）`}
  else if(mode==='teacher'){const p=PEOPLE[id],home=Object.keys(HOME).find(c=>HOME[c]===id);title=pName(id)+(p?' '+p.title:'')+' 課表';meta=`${home?home+' 導師　':''}每週授課 ${teach.length} 節　任教 ${new Set(teach.map(l=>l.c).filter(Boolean)).size} 個班`}
  else{const used=new Set(teach.map(l=>l.d+'-'+l.p)).size;title=id+' 使用表';meta=`每週使用 ${used} 節　空堂 ${(PER.length-1)*5-used} 節`}
  return{mode,items,title,meta};
}
function lineFor(mode,l){
  if(mode==='class')return{t:l.s==='晨光閱讀'?'':l.t.map(pName).join('、'),r:l.r||''};
  if(mode==='teacher')return{t:l.c?l.c+' 班':'全校社團',r:roomOf(l)};
  return{t:(l.c?l.c+' 班':'社團')+(l.t.length?'・'+l.t.map(pName).join('、'):''),r:''};
}
function rr(x,y,w,h,r,c){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fitText(c,txt,max,size,weight){let s=size;do{c.font=`${weight||400} ${s}px ${FONT}`;if(c.measureText(txt).width<=max)break;s-=1}while(s>12);return s}
function drawSheet(v,pageNo,pageCnt){
  const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;const c=cv.getContext('2d');
  c.fillStyle='#f7f5ef';c.fillRect(0,0,PW,PH);
  const g=c.createLinearGradient(0,0,0,260);g.addColorStop(0,'#dcebf5');g.addColorStop(1,'#f7f5ef');c.fillStyle=g;c.fillRect(0,0,PW,260);
  const M=70;c.textBaseline='alphabetic';
  c.fillStyle='#4f5e68';c.font=`400 30px ${FONT}`;c.fillText(`開瑄國小・${DATA.year||''} 學年度課表`,M,92);
  c.fillStyle='#9fcbe6';for(let i=0;i<4;i++)c.fillRect(M+i*14,118,7,52);
  c.fillStyle='#142836';fitText(c,v.title,1100,64);c.lineWidth=1.6;c.strokeStyle='#142836';c.fillText(v.title,M+76,166);c.strokeText(v.title,M+76,166);
  c.fillStyle='#4f5e68';c.font=`400 30px ${FONT}`;c.textAlign='right';c.fillText(v.meta,PW-M,160);c.textAlign='left';
  const top=210,lw=210,gap=10,lunchH=44,headH=62,bottom=PH-110;
  const colW=(PW-2*M-lw-gap*5)/5,rowH=(bottom-top-headH-gap-lunchH-gap*PER.length)/PER.length;
  DAYS.forEach((d,i)=>{const x=M+lw+gap+i*(colW+gap);rr(x,top,colW,headH,14,c);c.fillStyle='#d8e8f3';c.fill();c.fillStyle='#24517a';c.font=`400 32px ${FONT}`;c.textAlign='center';c.fillText('星期'+d,x+colW/2,top+43);c.textAlign='left'});
  let y=top+headH+gap;
  PER.forEach((p,pi)=>{
    if(pi===5){rr(M,y,PW-2*M,lunchH,22,c);c.fillStyle='#eceae3';c.fill();c.fillStyle='#24517a';c.font=`400 26px ${FONT}`;c.textAlign='center';c.fillText('午餐・午休 12:00–13:20',PW/2,y+31);c.textAlign='left';y+=lunchH+gap}
    rr(M,y,lw,rowH,14,c);c.fillStyle='#ffffff';c.fill();c.strokeStyle='#e3e0d6';c.lineWidth=2;c.stroke();
    c.fillStyle='#142836';c.font=`400 32px ${FONT}`;c.fillText(p[0],M+22,y+rowH/2-4);
    c.fillStyle='#4f5e68';c.font=`400 24px ${FONT}`;c.fillText(`${p[1]}–${p[2]}`,M+22,y+rowH/2+30);
    for(let d=0;d<5;d++){
      const x=M+lw+gap+d*(colW+gap),its=v.items.filter(l=>l.d===d&&l.p===pi);
      if(!its.length){rr(x,y,colW,rowH,14,c);c.setLineDash([10,8]);c.strokeStyle='#d2d7d6';c.lineWidth=2;c.stroke();c.setLineDash([]);
        const lbl=v.mode!=='class'?(pi>0?'空堂':''):(pi>=5&&!v.items.some(l=>l.d===d&&l.p>=5)?'無課':'');
        if(lbl){c.fillStyle='#8a979e';c.font=`400 24px ${FONT}`;c.textAlign='center';c.fillText(lbl,x+colW/2,y+rowH/2+8);c.textAlign='left'}continue}
      const h=(rowH-(its.length-1)*6)/its.length;
      its.forEach((l,k)=>{const yy=y+k*(h+6),[bg,ic]=PDF_C[cat(l.s)];
        rr(x,yy,colW,h,14,c);c.fillStyle=bg;c.fill();c.strokeStyle=ic+'55';c.lineWidth=2;c.stroke();
        c.fillStyle=ic;c.beginPath();c.arc(x+24,yy+(its.length>1?h/2:30),7,0,7);c.fill();
        const ln=lineFor(v.mode,l),max=colW-56,tx=x+44;
        if(its.length>1){const s=fitText(c,l.s+'　'+ln.t,max,24);c.fillStyle='#142836';c.fillText(l.s+'　'+ln.t,tx,yy+h/2+s*0.36);return}
        const lines=[[l.s,34,'#142836',true],[ln.t,26,'#2b3f4d'],[ln.r,22,ln.r&&!ln.r.endsWith(' 教室')?'#1f4f73':'#4f5e68']].filter(a=>a[0]);
        if(d===2&&pi===0&&v.mode==='class')lines.push(['週三晨光為升旗時間',20,'#6b7b86']);
        const tot=lines.reduce((a,b)=>a+b[1]*1.3,0);let ty=yy+(h-tot)/2;
        for(const[tx2,sz,col,bold]of lines){const s=fitText(c,tx2,max,sz);ty+=s*1.3;c.fillStyle=col;c.fillText(tx2,tx,ty-s*0.28);if(bold){c.strokeStyle=col;c.lineWidth=.9;c.strokeText(tx2,tx,ty-s*0.28)}}
      });
    }
    y+=rowH+gap;
  });
  const cs=Object.keys(CATN).filter(k=>v.items.some(l=>cat(l.s)===k));let lx=M;c.font=`400 24px ${FONT}`;
  for(const k of cs){c.fillStyle=PDF_C[k][1];c.beginPath();c.arc(lx+9,PH-58,9,0,7);c.fill();c.fillStyle='#4f5e68';c.fillText(CATN[k],lx+26,PH-50);lx+=c.measureText(CATN[k]).width+60}
  const n=new Date();c.textAlign='right';c.fillStyle='#8a979e';c.fillText(`列印日期 ${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()}${pageCnt>1?`　第 ${pageNo} / ${pageCnt} 頁`:''}`,PW-M,PH-50);c.textAlign='left';
  return cv;
}
function buildPDF(pages){
  const enc=new TextEncoder(),parts=[],xref=[];let off=0;
  const put=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);off+=b.length};
  const W=841.89,H=595.28,n=pages.length,total=3+3*n;
  put('%PDF-1.4\n%âãÏÓ\n');
  const obj=(id,body,stream)=>{xref[id]=off;put(`${id} 0 obj\n`);put(body);if(stream){put('\nstream\n');put(stream);put('\nendstream')}put('\nendobj\n')};
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,`<</Type/Pages/Kids[${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]/Count ${n}>>`);
  pages.forEach((pg,i)=>{const pid=3+3*i,cid=pid+1,iid=pid+2;
    obj(pid,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 ${iid} 0 R>>>>/Contents ${cid} 0 R>>`);
    const cs=enc.encode(`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`);obj(cid,`<</Length ${cs.length}>>`,cs);
    obj(iid,`<</Type/XObject/Subtype/Image/Width ${pg.w}/Height ${pg.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${pg.bytes.length}>>`,pg.bytes)});
  const xo=off;put(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)put(String(xref[i]).padStart(10,'0')+' 00000 n \n');
  put(`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
const jpegBytes=cv=>{const s=atob(cv.toDataURL('image/jpeg',.9).split(',')[1]);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function exportPDF(all){
  if(st.mode==='now')return;
  const btn=all?$('pdfAll'):$('pdfOne'),label=btn.textContent;btn.disabled=true;
  try{
    try{const txt=new Set(('開瑄國小學年度課表使用表導師每週節不含晨光授課任教個班空堂無課午餐休列印日期第頁星期一二三四五六七全校社團教室週三為升旗時間・、（）0123456789/:–　'+Object.values(CATN).join('')+L.map(l=>l.s+l.t.map(pName).join('')+l.c+roomOf(l)).join('')+Object.values(PEOPLE).map(p=>p.name+p.title).join('')+(DATA.year||'')));
      await Promise.race([document.fonts.load('400 32px Huninn',[...txt].join('')),new Promise(r=>setTimeout(r,8000))]);await document.fonts.ready}catch(e){}
    const{cls,tch,rooms}=lists();const ids=all?(st.mode==='class'?cls:st.mode==='teacher'?tch:rooms):[st.id];
    const pages=[];
    for(let i=0;i<ids.length;i++){btn.textContent=`製作中 ${i+1}/${ids.length}`;await new Promise(r=>setTimeout(r,0));
      const cv=drawSheet(viewOf(st.mode,ids[i]),i+1,ids.length);pages.push({w:PW,h:PH,bytes:jpegBytes(cv)})}
    const blob=buildPDF(pages);
    const name=all?({class:'全校班級課表',teacher:'全校教師課表',room:'上課地點使用表'}[st.mode]):viewOf(st.mode,st.id).title.replace(/\s+/g,'');
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${name}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){alertMsg('匯出失敗：'+(e.message||e))}
  finally{btn.disabled=false;btn.textContent=label;pdfLabels()}
}
function alertMsg(t){$('editnote').textContent=t}
function pdfLabels(){
  const on=st.mode!=='now';$('pdfbar').hidden=!on;if(!on)return;
  const{cls,tch,rooms}=lists();
  $('pdfAll').textContent=st.mode==='class'?`全部班級（${cls.length} 頁）`:st.mode==='teacher'?`全部老師（${tch.length} 頁）`:`全部地點（${rooms.length} 頁）`;
}
$('pdfOne').onclick=()=>exportPDF(false);
$('pdfAll').onclick=()=>exportPDF(true);
